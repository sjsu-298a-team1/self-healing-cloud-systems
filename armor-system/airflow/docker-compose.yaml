# Local Airflow for the ARMOR D1 pipeline. Development only.
#
# LocalExecutor + Postgres. No Celery, Redis or Flower: this orchestrates one
# CPU pipeline on one machine, so the extra moving parts would be noise.
#
# Airflow is not supported natively on Windows, so Docker is the supported route
# here, not a convenience.
#
#   docker compose up -d        start
#   docker compose logs -f      follow
#   docker compose down         stop
#   docker compose down -v      stop and delete the metadata database
#
# The repository is mounted READ-ONLY at /opt/airflow/repo. The pipeline writes
# its artifacts back into armor-system/data/, so running it against the checkout
# would overwrite the team's reviewed artifacts on every run. Instead the DAG
# rsyncs the repository into the writable `airflow-workspace` volume, runs there,
# and diffs the result against the read-only original. Tasks run as the host user
# (see AIRFLOW_UID in .env) so generated files are not owned by root.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Parse DAGs less often; this DAG set is small and static.
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
    # Surface task failures. Set the SMTP vars in .env to actually deliver them;
    # without SMTP configured, failures still show in the UI and the logs.
    AIRFLOW__EMAIL__EMAIL_BACKEND: airflow.utils.email.send_email_smtp
    AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-localhost}
    AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-25}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_FROM:-airflow@localhost}
    # Alerting (plugins/armor_alerts.py). The log and file sinks always work;
    # the webhook and email sinks switch themselves on when configured, and say
    # in the task log when they are not, rather than failing silently.
    ARMOR_ALERT_DIR: /opt/airflow/workspace/alerts
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-25}
    SMTP_FROM: ${SMTP_FROM:-airflow@localhost}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    # The repository, READ-ONLY. It is the source of truth the DAG compares
    # against, so no task may write to it. An earlier version mounted this
    # read-write and the pipeline overwrote the team's reviewed artifacts on
    # every scheduled run.
    - ../..:/opt/airflow/repo:ro
    # The disposable run workspace. The DAG rsyncs the repository here and runs
    # the pipeline against this copy. Holds the fetched release and the feature
    # cache between runs, so it is a named volume rather than a tmpdir.
    - airflow-workspace:/opt/airflow/workspace
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Docker creates a named volume owned by root, but every Airflow container
  # runs as AIRFLOW_UID with group 0, so the workspace would be unwritable.
  # This is the one service that needs root, and it does nothing else.
  workspace-init:
    image: busybox:1.37
    user: root
    command: >
      sh -c "mkdir -p /opt/airflow/workspace &&
             chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/workspace &&
             chmod -R g+rwX /opt/airflow/workspace &&
             echo 'workspace ready'"
    volumes:
      - airflow-workspace:/opt/airflow/workspace

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-airflow}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-airflow}" \
          --firstname Admin --lastname User --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@localhost}" || true
    depends_on:
      postgres:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Host port is configurable: this machine already runs another Airflow
      # stack, and 8080/8081 are taken. Change AIRFLOW_PORT in .env if 8088 is
      # also busy; the container always listens on 8080 internally.
      - "${AIRFLOW_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
  # Survives `docker compose down` so the 466 MB release is fetched once.
  # `docker compose down -v` removes it along with the metadata database.
  airflow-workspace:
